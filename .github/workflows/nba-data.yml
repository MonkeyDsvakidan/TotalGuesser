name: NBA-Daten

on:
  schedule:
    - cron: '17 4 * * 1' # montags 04:17 UTC
  workflow_dispatch:
    inputs:
      args:
        description: 'Argumente für nba_import.py (leer = alle Spieler, aktive neu laden)'
        required: false
        default: '--refresh-active'

permissions:
  contents: write

concurrency:
  group: nba-data
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - run: pip install -r scripts/requirements.txt

      # Cache der NBA-Antworten: ein abgebrochener Lauf macht beim nächsten Mal weiter
      - uses: actions/cache/restore@v4
        with:
          path: scripts/.cache
          key: nba-cache-${{ github.run_id }}
          restore-keys: nba-cache-

      - name: Import
        run: |
          set -o pipefail
          python -u scripts/nba_import.py ${{ github.event.inputs.args || '--refresh-active' }} 2>&1 | tee import.log

      # Letzte Zeilen als Annotation, damit der Fehler direkt in der Übersicht steht
      - name: Fehler melden
        if: failure()
        run: echo "::error title=Import fehlgeschlagen::$(tail -n 8 import.log | tr '\n' ' ' | cut -c1-900)"

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: scripts/.cache
          key: nba-cache-${{ github.run_id }}

      - name: Daten committen
        run: |
          git add web/public/data
          if git diff --cached --quiet; then
            echo "Keine Änderungen"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "NBA-Daten aktualisieren"
          git push
