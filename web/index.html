<!doctype html>
<html lang="de-CH">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: im Homebildschirm-Modus reicht die Seite unter die Statusleiste (siehe safe-area in index.css) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#17120e" />
    <!-- Zum Home-Bildschirm hinzufügen (iPhone): ohne Safari-Leisten starten -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- Home-Bildschirm (GameMaster): installiert die gemeinsame App der Domain-Wurzel (Repo monkeydsvakidan.github.io).
         Die alten Dateien in public/ (manifest, Icons) bleiben nur für bereits installierte TotalGuesser-Apps. -->
    <meta name="apple-mobile-web-app-title" content="GameMaster" />
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <!-- volle Adresse: sonst ersetzt Vite den Pfad durch die alte public/manifest.webmanifest -->
    <link rel="manifest" href="https://monkeydsvakidan.github.io/manifest.webmanifest" />
    <title>TotalGuesser</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
